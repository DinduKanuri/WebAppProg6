<!DOCTYPE html>
<html>

<head>
    <title>Actor Guess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

 
<body class="container mt-4">

<h2>Actors by Dindu Kanuri</h2>

<form>
    <label for="actor">Peter Pan</label>
    <input type="password" id="actor" value="Robin Williams">

    <br>

    <label for="guess">Who is the actor</label>
    <input type="text" id="guess">

    <br>

    <input id="checkButton" class="btn btn-primary mt-2"
       type="button" value="Check the guess"
       onclick="checkActor()">

</form>


<div id="result" class="mt-2">
    Correct: 0 Not Correct: 0
</div>

<div>
    <img id="foodPic" src="icecream.jpg" width="150" height="150"
     class="img-thumbnail mt-3" onclick="updatePic()">
</div>


<script>

let correct = 0
let notCorrect = 0

function checkActor() {
    let actor = document.getElementById("actor").value
    let guess = document.getElementById("guess").value

    if (actor == guess) {
        correct = correct + 1
        alert("That's right")
    } else {
        notCorrect = notCorrect + 1
        alert("Better luck next time")
    }

    if (notCorrect > 10) {
    document.getElementById("checkButton")
        .setAttribute("onclick", "tooManyWrong()")
}

    document.getElementById("result").innerHTML =
        "Correct: " + correct + " Not Correct: " + notCorrect
}

function tooManyWrong() {
    alert("Sorry, too many wrong guesses.")
}

let usePic = 1

function updatePic() {
    switch (usePic) {
        case 1:
            document.getElementById("foodPic").src = "kebab.jpg"
            usePic = 2
            break
        case 2:
            document.getElementById("foodPic").src = "noodles.jpg"
            usePic = 3
            break
        case 3:
            document.getElementById("foodPic").src = "icecream.jpg"
            usePic = 1
            break
    }
}

</script>

</body>
</html>
